    <text x="64" y="180" fill="#15243A" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="62">Ruslan Akhmetov</text>
    <text x="68" y="222" fill="#516B7E" font-family="Arial, Helvetica, sans-serif" font-size="22">Analyze. Build. Measure.</text>
    <rect x="68" y="263" width="193" height="32" rx="16" fill="#FFFFFF" stroke="#B9D2DC"/>
    <text x="84" y="285" fill="#516B7E" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1">HSE FCS  /  MSc 2028</text>
    <path d="M798 114 L863 114 M1019 152 L1019 181 M830 226 L880 226" fill="none" stroke="#007F82" stroke-width="2" opacity=".55"/>
