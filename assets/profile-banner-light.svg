<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ruslan Akhmetov — Data Science and Applied AI</title>
  <desc id="desc">Portfolio banner with two connected project areas: product analytics and AI safety.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#EAF4F6"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#66869A" opacity=".11"/></pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
