<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ruslan Akhmetov — Data Science and Applied AI</title>
  <desc id="desc">Dark blue banner with cyan and coral accents and a connected nodes motif</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10192f"/>
      <stop offset="1" stop-color="#182849"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6d0"/>
      <stop offset="1" stop-color="#fa8c7a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1055" cy="75" r="220" fill="#55d6d0" opacity=".07"/>
    <circle cx="1110" cy="270" r="170" fill="#fa8c7a" opacity=".06"/>
    <rect x="66" y="65" width="66" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="66" y="119" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#72ded7">DATA SCIENCE  /  APPLIED AI</text>
    <text x="62" y="202" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#f5f8ff">Ruslan Akhmetov</text>
    <text x="66" y="243" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b8c6df">From data to decisions, from ideas to products</text>
    <g fill="none" stroke="#74d7d4" stroke-width="2" opacity=".55">
      <path d="M810 212 L875 155 L954 190 L1020 104 L1101 141"/>
      <path d="M875 155 L908 79 L1020 104 L1070 228 L954 190"/>
      <path d="M810 212 L904 244 L954 190"/>
    </g>
    <g fill="#182849" stroke="#72ded7" stroke-width="3">
      <circle cx="810" cy="212" r="9"/><circle cx="875" cy="155" r="10"/><circle cx="908" cy="79" r="7"/>
      <circle cx="954" cy="190" r="12"/><circle cx="1020" cy="104" r="10"/><circle cx="1101" cy="141" r="8"/>
      <circle cx="1070" cy="228" r="8"/><circle cx="904" cy="244" r="7"/>
    </g>
    <circle cx="954" cy="190" r="4" fill="#fa8c7a"/>
    <circle cx="1020" cy="104" r="4" fill="#fa8c7a"/>
  </g>
</svg>
